[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "payment-risk-monitoring"
version = "0.1.0"
description = "Validated PaySim ingestion and reproducible SQL payment-risk investigation"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = ["duckdb==1.4.3"]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "ruff==0.14.1"]

[project.scripts]
payment-risk = "payment_risk.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
payment_risk = ["sql/*.sql", "demo.csv", "paysim_manifest.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
